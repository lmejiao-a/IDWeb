<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiante</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <h1>Registro de Estudiante</h1>
        <p>Complete todos los campos del formulario.</p>

        <form>
            <fieldset>
                <legend>Información Personal</legend>

                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="codigo">Código de estudiante:</label>
                    <input type="text" id="codigo" name="codigo"
                           pattern="[0-9]{8}"
                           maxlength="8"
                           required>
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="campo">
                    <label for="fecha">Fecha de nacimiento:</label>
                    <input type="date" id="fecha" name="fecha"
                           min="1990-01-01"
                           max="2010-12-31"
                           required>
                </div>

                <div class="campo">
                    <label for="edad">Edad:</label>
                    <input type="number" id="edad" name="edad"
                           min="15" max="60" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Información de la Cuenta</legend>

                <div class="campo">
                    <label for="carrera">Carrera Profesional:</label>
                    <select id="carrera" name="carrera" required>
                        <option value="">Seleccione una carrera</option>
                        <option value="civil">Ingeniería Civil</option>
                        <option value="sistemas">Ingeniería de Sistemas</option>
                        <option value="industrial">Ingeniería Industrial</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password"
                           minlength="8"
                           pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                           title="Debe tener mínimo 8 caracteres, una mayúscula y un número"
                           required>
                </div>

                <div class="campo">
                    <label>Turno:</label>

                    <div class="radio-group">
                        <input type="radio" id="manana" name="turno" value="mañana" required>
                        <label for="manana">Mañana</label>

                        <input type="radio" id="tarde" name="turno" value="tarde">
                        <label for="tarde">Tarde</label>

                        <input type="radio" id="noche" name="turno" value="noche">
                        <label for="noche">Noche</label>
                    </div>
                </div>

                <div class="campo">
                    <label for="comentarios">Comentarios:</label>
                    <textarea id="comentarios" name="comentarios"
                              rows="5"
                              placeholder="Escriba sus comentarios..."></textarea>
                </div>

                <div class="terminos">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">
                        Acepto los términos y condiciones.
                    </label>
                </div>
            </fieldset>

            <button type="submit">Registrar</button>
            <button type="reset">Limpiar</button>
        </form>
    </div>

</body>
</html>
